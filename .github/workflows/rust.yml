name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      run: rustup toolchain install
    - name: Build (default)
      run: cargo build --locked --all-targets --verbose
    - name: Build (all features)
      run: cargo build --locked --all-features --all-targets --verbose
    - name: Run tests (all features)
      run: cargo test --locked --all-features --verbose
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Clippy
      run: cargo clippy --all-features --all-targets
